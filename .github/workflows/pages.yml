name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued one but never an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot
    steps:
      - uses: actions/checkout@v4
      # The editor and web templates (the templates come from a ~1.3 GB archive) are kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('godot/tools/install_godot.sh') }}
      - run: tools/install_godot.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # A fresh checkout has no .godot/ import cache; scripts with a class_name need it.
      - run: timeout 600 godot --headless --path . --import
      - run: timeout 1200 godot --headless --path . --script tools/check.gd
      - run: mkdir -p build/web && timeout 600 godot --headless --path . --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
